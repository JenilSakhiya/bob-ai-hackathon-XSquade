services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./cybersentinel.db
      - AI_PROVIDER=mock
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - cybersentinel-data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  cybersentinel-data:
